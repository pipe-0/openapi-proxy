name: Release

# Versions and publishes the command line tool, @pipe0/openapi-proxy, with
# Changesets (https://changesets.dev). A push to main is one of three things:
#
# - It carries changesets (files in .changeset/). The pull request "Version
#   Packages" is opened or updated: it holds the new version and the changelog.
# - It carries none, and packages/cli has a version npm does not have, which is
#   what merging that pull request leaves. The tool is tested, packed and
#   published.
# - Neither. Nothing happens.
#
# There is no npm token. npm trusts this workflow by its file name (trusted
# publishing, in the package's settings on npmjs.com), so this file has to stay
# .github/workflows/release.yml.
on:
  push:
    branches: [main]

# Nothing by default. Each job says what it needs.
permissions: {}

# One run at a time for main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: Version, publish or nothing
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Look for changesets and for versions npm does not have
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Open or update the version pull request
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      # To commit the new version and the changelog, and to open the pull request.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2

  pack:
    name: Test and pack
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # What is published has passed the tests of the engine and of the tool,
      # and works when it is installed outside this repository.
      - run: pnpm --filter @openapi-proxy/core test
      - run: pnpm --filter @pipe0/openapi-proxy typecheck
      - run: pnpm --filter @pipe0/openapi-proxy test
      - run: pnpm --filter @pipe0/openapi-proxy test:packed
      # Packing builds the tool (prepack). The tarball is handed to the next
      # job, which is the only one that may publish.
      - name: Pack
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      # For the git tag and the GitHub release.
      contents: write
      # What trusted publishing needs: a token that says which workflow this is.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
